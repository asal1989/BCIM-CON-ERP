  <!-- PWA manifest + iOS "Add to Home Screen" tags — the ESS-only subdomain
       (bcimhr.bcim.in) serves this exact same build (see App.js's
       isEssDomain() hostname check), so it needs its own manifest/icon/title

       sets of static tags) avoids any ambiguity from duplicate <link
       rel="manifest">/apple-touch-icon> tags, which browsers don't handle
       consistently. iOS reads these at "Add to Home Screen" time, well after
       this runs, so a synchronous write this early is safe. -->
  <script>
    (function () {
      var isEss = window.location.hostname === 'bcimhr.bcim.in';
      if (isEss) {
        document.write('<meta name="theme-color" content="#2F6FED">');
        document.write('<link rel="manifest" href="/manifest-ess.json">');
        document.write('<meta name="apple-mobile-web-app-title" content="BCIM ESS">');
        document.write('<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-ess.png">');
        document.write('<link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-ess-167.png">');
        document.write('<link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-ess-152.png">');

        document.write('<meta name="theme-color" content="#1D4ED8">');
        document.write('<link rel="manifest" href="/manifest.json">');
        document.write('<meta name="apple-mobile-web-app-title" content="BCIM ERP">');
        document.write('<link rel="apple-touch-icon" href="/bcim-logo.png">');

    // PWA service worker + AUTO-UPDATE. Without the controllerchange reload

    // so a new version takes control immediately; this listener then reloads
    // the page once so the fresh assets actually render.
    if ('serviceWorker' in navigator) {
      var hadController = !!navigator.serviceWorker.controller;
      var swRefreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (swRefreshing) return;
        swRefreshing = true;
        // Reload only when REPLACING an existing controller (a real update) —
        // not on the very first SW install for a brand-new visitor.
        if (!hadController) return;
        // Don't reload mid-login: a reload racing the login network call
        // could land before the fresh session is written to storage,
        // reloading into stale/old auth data and misreporting "session
        // expired" right after a successful sign-in. Wait for the in-flight
        // request to finish (checked by authStore.js) before reloading.
        var waitAndReload = function () {
          if (window.__authRequestInFlight) {
            setTimeout(waitAndReload, 300);
          } else {
            window.location.reload();
          }
        };
        waitAndReload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
          // Proactively check for a newer SW on every page load.
          reg.update();
        }).catch(function (e) {
          console.warn('[SW] Registration failed:', e);
        });
      });
    }
